<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knapsack Problem Solver</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/script.js" defer></script>
    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Add Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-gray-100 to-indigo-100 min-h-screen flex items-center justify-center p-6 font-poppins">
    <div class="container max-w-4xl mx-auto space-y-8">
        <div class="text-center bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-6 rounded-xl shadow-lg">
            <h1 class="text-5xl font-bold mb-2 flex items-center justify-center">
                <i class="fas fa-sack-dollar mr-3"></i> Knapsack Problem Solver
            </h1>
            <p class="text-indigo-100">Solve optimization problems with bio-inspired algorithms</p>
        </div>

        <!-- Input Section -->
        <div class="input-section bg-white rounded-xl shadow-xl p-8 fade-in border border-gray-200">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6">Problem Input</h2>
            <div class="space-y-6">
                <!-- Capacity Input -->
                <div class="flex items-center space-x-4">
                    <label for="capacity" class="text-gray-700 font-medium w-1/3">Knapsack Capacity</label>
                    <input type="number" id="capacity" min="1" value="15" class="w-2/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                </div>
                <!-- Number of Items Input -->
                <div class="flex items-center space-x-4">
                    <label for="numItems" class="text-gray-700 font-medium w-1/3">Number of Items</label>
                    <input type="number" id="numItems" min="1" max="1000" value="10" class="w-1/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                    <button onclick="generateItems()" class="tooltip bg-indigo-600 text-white px-5 py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                        <i class="fas fa-dice mr-2"></i> Generate Items
                        <span class="tooltip-text">Generate random weights and values</span>
                    </button>
                </div>
            </div>

            <!-- Items Table -->
            <h3 class="text-xl font-semibold text-gray-800 mt-8 mb-3">Items</h3>
            <div class="custom-scrollbar max-h-64 overflow-y-auto border border-gray-300 rounded-lg shadow-sm">
                <table id="itemsTable" class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Item</th>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Weight</th>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Value</th>
                        </tr>
                    </thead>
                    <tbody id="itemList" class="bg-white"></tbody>
                </table>
            </div>

            <!-- Item Actions -->
            <div class="flex justify-center space-x-4 mt-6">
                <button onclick="addItem()" class="tooltip bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 transition shadow-md">
                    <i class="fas fa-plus mr-2"></i> Add Item
                    <span class="tooltip-text">Add a new item</span>
                </button>
                <button onclick="removeItem()" class="tooltip bg-red-600 text-white px-5 py-3 rounded-lg hover:bg-red-700 transition shadow-md">
                    <i class="fas fa-trash-alt mr-2"></i> Remove Last Item
                    <span class="tooltip-text">Remove the last item</span>
                </button>
                <button onclick="clearItems()" class="tooltip bg-gray-600 text-white px-5 py-3 rounded-lg hover:bg-gray-700 transition shadow-md">
                    <i class="fas fa-eraser mr-2"></i> Clear Items
                    <span class="tooltip-text">Clear all items</span>
                </button>
            </div>

            <!-- Algorithm Selection -->
            <div class="flex items-center space-x-4 mt-8">
                <label for="algorithm" class="text-gray-700 font-medium w-1/3">Algorithm</label>
                <select id="algorithm" class="w-2/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm bg-indigo-50">
                    <option value="ga">Genetic Algorithm</option>
                    <option value="aco">Ant Colony Optimization</option>
                    <option value="pso">Particle Swarm Optimization</option>
                    <option value="cs">Cuckoo Search</option>
                    <option value="fa">Firefly Algorithm</option>
                </select>
            </div>
            <button onclick="solveProblem()" id="solveButton" class="tooltip w-full mt-6 bg-indigo-600 text-white px-5 py-4 rounded-lg hover:bg-indigo-700 transition shadow-lg">
                <i class="fas fa-play mr-2"></i> Solve Problem
                <span class="tooltip-text">Run the selected algorithm</span>
            </button>
        </div>

        <!-- Output Section -->
        <div class="output-section bg-white rounded-xl shadow-xl p-8 fade-in border border-gray-200">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6">Solution</h2>
            <div id="solutionInfo" class="text-gray-600 mb-6">
                Select an algorithm and click "Solve" to find the best solution.
            </div>
            <div id="loadingIndicator" class="hidden text-center text-indigo-600 font-medium mb-6 flex items-center justify-center">
                <i class="fas fa-spinner fa-spin mr-2"></i> Solving... Please wait.
            </div>
            <div class="custom-scrollbar max-h-64 overflow-y-auto border border-gray-300 rounded-lg shadow-sm">
                <table id="solutionTable" class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Item</th>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Weight</th>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Value</th>
                            <th class="p-4 text-left text-gray-700 font-semibold border-b">Included</th>
                        </tr>
                    </thead>
                    <tbody id="solutionBody" class="bg-white"></tbody>
                </table>
            </div>
            <div class="mt-6 text-gray-800 grid grid-cols-2 gap-4">
                <div><strong>Total Value:</strong> <span id="totalValue" class="text-indigo-600 font-semibold">0</span></div>
                <div><strong>Total Weight:</strong> <span id="totalWeight" class="text-indigo-600 font-semibold">0</span></div>
            </div>
        </div>
    </div>    
</body>
</html>
</html>
