<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knapsack Problem Solver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Tooltip */
        .tooltip {
            position: relative;
        }
        .tooltip .tooltip-text {
            visibility: hidden;
            width: 120px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="container max-w-4xl mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Knapsack Problem Solver</h1>
            <p class="text-gray-600">Solve optimization problems with bio-inspired algorithms</p>
        </div>

        <!-- Input Section -->
        <div class="input-section bg-white rounded-xl shadow-lg p-6 fade-in">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Problem Input</h2>
            <div class="space-y-4">
                <!-- Capacity Input -->
                <div class="flex items-center space-x-4">
                    <label for="capacity" class="text-gray-700 font-medium w-1/3">Knapsack Capacity</label>
                    <input type="number" id="capacity" min="1" value="15" class="w-2/3 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <!-- Number of Items Input -->
                <div class="flex items-center space-x-4">
                    <label for="numItems" class="text-gray-700 font-medium w-1/3">Number of Items</label>
                    <input type="number" id="numItems" min="1" max="1000" value="10" class="w-1/3 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <button onclick="generateItems()" class="tooltip bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                        Generate Items
                        <span class="tooltip-text">Generate random weights and values</span>
                    </button>
                </div>
            </div>

            <!-- Items Table -->
            <h3 class="text-lg font-semibold text-gray-800 mt-6 mb-2">Items</h3>
            <div class="custom-scrollbar max-h-64 overflow-y-auto border rounded-lg">
                <table id="itemsTable" class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-3 text-left text-gray-700">Item</th>
                            <th class="p-3 text-left text-gray-700">Weight</th>
                            <th class="p-3 text-left text-gray-700">Value</th>
                        </tr>
                    </thead>
                    <tbody id="itemList" class="bg-white"></tbody>
                </table>
            </div>

            <!-- Item Actions -->
            <div class="flex space-x-2 mt-4">
                <button onclick="addItem()" class="tooltip bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
                    Add Item
                    <span class="tooltip-text">Add a new item</span>
                </button>
                <button onclick="removeItem()" class="tooltip bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                    Remove Last Item
                    <span class="tooltip-text">Remove the last item</span>
                </button>
                <button onclick="clearItems()" class="tooltip bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    Clear Items
                    <span class="tooltip-text">Clear all items</span>
                </button>
            </div>

            <!-- Algorithm Selection -->
            <div class="flex items-center space-x-4 mt-6">
                <label for="algorithm" class="text-gray-700 font-medium w-1/3">Algorithm</label>
                <select id="algorithm" class="w-2/3 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="ga">Genetic Algorithm</option>
                    <option value="aco">Ant Colony Optimization</option>
                    <option value="pso">Particle Swarm Optimization</option>
                    <option value="cs">Cuckoo Search</option>
                    <option value="fa">Firefly Algorithm</option>
                </select>
            </div>
            <button onclick="solveProblem()" id="solveButton" class="tooltip w-full mt-4 bg-indigo-600 text-white px-4 py-3 rounded-lg hover:bg-indigo-700 transition">
                Solve Problem
                <span class="tooltip-text">Run the selected algorithm</span>
            </button>
        </div>

        <!-- Output Section -->
        <div class="output-section bg-white rounded-xl shadow-lg p-6 fade-in">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Solution</h2>
            <div id="solutionInfo" class="text-gray-600 mb-4">
                Select an algorithm and click "Solve" to find the best solution.
            </div>
            <div id="loadingIndicator" class="hidden text-center text-indigo-600 font-medium mb-4">
                Solving... Please wait.
            </div>
            <div class="custom-scrollbar max-h-64 overflow-y-auto border rounded-lg">
                <table id="solutionTable" class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-3 text-left text-gray-700">Item</th>
                            <th class="p-3 text-left text-gray-700">Weight</th>
                            <th class="p-3 text-left text-gray-700">Value</th>
                            <th class="p-3 text-left text-gray-700">Included</th>
                        </tr>
                    </thead>
                    <tbody id="solutionBody" class="bg-white"></tbody>
                </table>
            </div>
            <div class="mt-4 text-gray-800">
                <strong>Total Value:</strong> <span id="totalValue">0</span><br>
                <strong>Total Weight:</strong> <span id="totalWeight">0</span>
            </div>
        </div>
    </div>

    <script>
        // Initialize items array
        let items = [];

        // Generate random items based on user input
        function generateItems() {
            const numItems = parseInt(document.getElementById('numItems').value);
            if (numItems < 1 || numItems > 1000) {
                alert('Please enter a number between 1 and 1000.');
                return;
            }

            items = [];
            for (let i = 0; i < numItems; i++) {
                const weight = Math.floor(Math.random() * 100) + 1;
                const value = Math.floor(Math.random() * 100) + 1;
                items.push({ weight, value });
            }
            renderItems();
        }

        // Render items in a table
        function renderItems() {
            const itemList = document.getElementById('itemList');
            itemList.innerHTML = '';

            items.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-3">Item ${index + 1}</td>
                    <td class="p-3"><input type="number" class="item-weight w-full p-1 border rounded focus:ring-2 focus:ring-indigo-500" value="${item.weight}" min="1" data-index="${index}"></td>
                    <td class="p-3"><input type="number" class="item-value w-full p-1 border rounded focus:ring-2 focus:ring-indigo-500" value="${item.value}" min="1" data-index="${index}"></td>
                `;
                itemList.appendChild(row);
            });
        }

        // Add new item
        function addItem() {
            items.push({ weight: 1, value: 1 });
            renderItems();
        }

        // Remove last item
        function removeItem() {
            if (items.length > 0) {
                items.pop();
                renderItems();
            } else {
                alert('No items to remove.');
            }
        }

        // Clear all items
        function clearItems() {
            items = [];
            renderItems();
            document.getElementById('solutionInfo').innerHTML = 'Select an algorithm and click "Solve" to find the best solution.';
            document.getElementById('solutionBody').innerHTML = '';
            document.getElementById('totalValue').textContent = '0';
            document.getElementById('totalWeight').textContent = '0';
        }

        // Update items array when inputs change
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('item-weight')) {
                const index = parseInt(e.target.dataset.index);
                items[index].weight = parseInt(e.target.value) || 1;
            } else if (e.target.classList.contains('item-value')) {
                const index = parseInt(e.target.dataset.index);
                items[index].value = parseInt(e.target.value) || 1;
            }
        });

        // Solve the problem
        async function solveProblem() {
            if (items.length === 0) {
                alert('Please generate or add items before solving.');
                return;
            }

            const solveButton = document.getElementById('solveButton');
            const loadingIndicator = document.getElementById('loadingIndicator');
            solveButton.disabled = true;
            solveButton.textContent = 'Solving...';
            loadingIndicator.classList.remove('hidden');

            const algorithm = document.getElementById('algorithm').value;
            const capacity = parseInt(document.getElementById('capacity').value);

            const weights = items.map(item => item.weight);
            const values = items.map(item => item.value);

            try {
                const response = await fetch('/solve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        weights: weights,
                        values: values,
                        capacity: capacity,
                        algorithm: algorithm
                    })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                displaySolution(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('solutionInfo').innerHTML = '<span class="text-red-600">Error solving the problem. Please try again.</span>';
            } finally {
                solveButton.disabled = false;
                solveButton.textContent = 'Solve Problem';
                loadingIndicator.classList.add('hidden');
            }
        }

        // Display the solution
        function displaySolution(solution) {
            const solutionBody = document.getElementById('solutionBody');
            solutionBody.innerHTML = '';

            let algorithmName = '';
            switch(document.getElementById('algorithm').value) {
                case 'ga': algorithmName = 'Genetic Algorithm'; break;
                case 'aco': algorithmName = 'Ant Colony Optimization'; break;
                case 'pso': algorithmName = 'Particle Swarm Optimization'; break;
                case 'cs': algorithmName = 'Cuckoo Search'; break;
                case 'fa': algorithmName = 'Firefly Algorithm'; break;
            }

            document.getElementById('solutionInfo').innerHTML = `
                <strong class="text-gray-800">Algorithm:</strong> ${algorithmName}<br>
                <strong class="text-gray-800">Solution found:</strong> ${solution.solution.join(', ')}
            `;

            items.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = solution.solution[index] === 1 ? 'bg-green-100' : 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-3">Item ${index + 1}</td>
                    <td class="p-3">${item.weight}</td>
                    <td class="p-3">${item.value}</td>
                    <td class="p-3">${solution.solution[index] === 1 ? 'Yes' : 'No'}</td>
                `;
                solutionBody.appendChild(row);
            });

            document.getElementById('totalValue').textContent = solution.total_value;
            document.getElementById('totalWeight').textContent = solution.total_weight;
        }

        // Initialize with empty items
        renderItems();
    </script>
</body>
</html>
